# herdr-projects settings (stowed from dotfiles). herdr-projects saves this file
# with a tmp+rename, so changes made from its popup replace the symlink: edit
# the copy in ~/dotfiles/herdr-projects instead.

[profiles.fable]
agent = "claude"
model = "claude-fable-5-1"
description = "Coordinator tier"

[profiles.opus]
agent = "claude"
model = "claude-opus-5-5"
description = "Thread tier"

[defaults]                        # what `new` writes into a new PROJECT.md
coordinator_profile = "fable"
thread_profile = "opus"

[safety.default]
yolo = true
coordinator_profiles = ["fable"]
thread_profiles = ["opus", "fable"]
