onboarding = false

[theme]
name = "gruvbox"
auto_switch = false

[ui]
status_indicators = "symbols"
prompt_new_tab_name = false
# herdr-projects: "needs you" count in the tab bar (from PATH; default root ~/.herdr-projects)
tab_bar_right = [{ type = "command", command = "herdr-projects needs-you --line", interval_seconds = 15, timeout_seconds = 5 }]

# herdr-projects: group agents and spaces by project (written by `herdr-projects configure`)
[ui.sidebar.agents]
rows = [["state_icon", { token = "agent", bold = false, dim = false, rules = [{ contains = "​", bold = true }] }, "state_text"], [{ token = "$hp_sub", dim = true }]]

[ui.sidebar.spaces]
rows = [["state_icon", { token = "workspace", rules = [{ contains = "⠀", bold = true }] }, { token = "branch", dim = true }, "git_status"]]

[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump to anything"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "herdr-projects.open-popup"
description = "projects"
