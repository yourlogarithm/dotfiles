onboarding = false

[theme]
name = "gruvbox"
auto_switch = false

[ui]
status_indicators = "symbols"
prompt_new_tab_name = false

[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump to anything"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "herdr-projects.open-popup"
description = "projects"
