# kitty
# Managed by ~/Projects/dotfiles (stow package: kitty)

# Theme (same palette as the old alacritty gruvbox_dark import)
include themes/gruvbox_dark.conf

font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.0

window_padding_width 8
background_opacity   1.0

# alacritty parity: no bell, no "really close?" prompt with herdr running
enable_audio_bell       no
confirm_os_window_close 0

# No `shell` override: kitty launches the login shell, resolved by absolute
# path from the user database (set zsh via chsh — see bootstrap.sh). Avoids
# hardcoding a non-portable path and the macOS GUI-launch PATH problem.

# Shift+Enter -> ESC CR (newline in Claude Code / nvim-in-terminal)
map shift+enter send_text all \x1b\r

# >>> herdr-radar font block
symbol_map U+E1A0-U+E1BA Herdr Agent Icons Max
symbol_map U+E1C0-U+E1C5 Herdr Agent Icons Max
# <<< herdr-radar font block
